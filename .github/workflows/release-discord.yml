name: Release to Discord
on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post release to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.event.repository.name }}
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/$TAG" > release.json
          jq --arg a "$REPO" --arg u "$(jq -r .html_url release.json)" '
          def snip($u):
            if length <= 500 then .
            else .[:500] as $s
              | ([($s | rindex("\n")), ($s | rindex(" "))] | map(select(. != null and . > 200)) | first) as $i
              | ($s[:($i // 500)] | sub("\\s+$"; "")) + "\n\n… [**Full notes →**](" + $u + ")"
            end;
          {embeds: [{author: {name: $a}, title: (.name // .tag_name), url: .html_url,
                     description: ((.body // "") | snip($u)), color: 5814783}]}' release.json \
          | curl -sf -H "Content-Type: application/json" -d @- "$WEBHOOK"
